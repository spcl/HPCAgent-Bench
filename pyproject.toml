# The single source of the package metadata, version and dependencies. requirements/*.txt are
# rendered from this file by scripts/sync_requirements.py (the container images install those).
# There is no lockfile: agent-aider pins numpy 1.26 against numpy>=2 here, and dace tracks a branch
# tip, so no single resolution covers every extra.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcagent-bench"
version = "0.1.0"
description = "A benchmark for AI agents that optimize numerical code: NumPy kernels, a judge, and speedup scoring."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SPCL @ ETH Zurich", email = "yakupkoray.budanaz@inf.ethz.ch" }]
keywords = ["benchmark", "hpc", "llm-agents", "code-optimization", "numpy", "compilers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Benchmark",
]

# What the library imports at module level (hpcagent_bench/ outside benchmarks/ and tests/). The
# framework matrix (torch/jax/tvm/triton/...) is per platform and lives in the extras; numba is core
# because it is the default LLR/SciComp baseline.
# dace is not declared anywhere: PyPI rejects direct-URL requirements and the suite grades through
# the spcl/dace `extended` branch tip, so it is installed separately (README).
dependencies = [
    "numpy>=2,<3",
    "scipy",
    "pandas",
    "matplotlib",
    "ml_dtypes",
    "pyyaml",
    "sqlmodel",
    "jinja2",
    "cffi",
    "sympy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/spcl/HPCAgent-Bench"
Repository = "https://github.com/spcl/HPCAgent-Bench"
Documentation = "https://github.com/spcl/HPCAgent-Bench/tree/main/docs"
Issues = "https://github.com/spcl/HPCAgent-Bench/issues"
Changelog = "https://github.com/spcl/HPCAgent-Bench/blob/main/CHANGELOG.md"

[project.scripts]
hpcagent-bench = "hpcagent_bench.cli:main"
hpcagent-bench-install-apptainer = "hpcagent_bench.containers:install_apptainer_main"
numpyto = "hpcagent_bench.translators.numpyto_common.cli:main"
numpyto_c = "hpcagent_bench.translators.numpyto_c.cli:main"
numpyto_fortran = "hpcagent_bench.translators.numpyto_fortran.cli:main"
numpyto_cupy = "hpcagent_bench.translators.numpyto_cupy.cli:main"
numpyto_numba = "hpcagent_bench.translators.numpyto_numba.cli:main"
numpyto_pythran = "hpcagent_bench.translators.numpyto_pythran.cli:main"

# A platform installs exactly one of cpu / nvidia / amd: they carry different builds of torch.
[project.optional-dependencies]
# The grading stack shared by every platform (nothing whose build differs per accelerator).
frameworks = [
    "pygount",
    "jsonschema",
    "setuptools",
    "tree-sitter-language-pack",
    "psutil",
    "py-cpuinfo",
    "GPUtil",
    # dace@extended imports it at runtime.
    "ordered-set>=4.0.0",
    # 0.19.0 turns subset_sum into a >600 s hang, then a SIGSEGV. Bump in its own commit.
    "pythran==0.18.1",
    "xgboost",
    # Python bindings for the libhdf5 / libnetcdf the images install; the image smoke imports both.
    "h5py",
    "netCDF4",
    # dace's analyses fail closed without them (sequential loops, no diagnostic).
    "islpy",
    "z3-solver",
    # The upstream KernelBench models the machine_learning ports are compared against import it.
    "einops",
]
# CPU jobs install torch from PyTorch's CPU index first (the PyPI wheel is the CUDA build); an index
# cannot be named in a PEP 508 requirement (see .github/actions/setup/action.yml).
cpu = ["hpcagent_bench[frameworks]", "torch", "jax"]
nvidia = [
    "hpcagent_bench[frameworks]",
    "torch",
    "jax[cuda13]",
    "cupy-cuda13x",
    "apache-tvm>=0.25.0rc0",
    "triton",
    "mpi4py",
]
amd = [
    "hpcagent_bench[frameworks]",
    "torch",
    # The ROCm jax plugin and AMD's triton come from the ROCm base image, not PyPI (the PyPI
    # triton is the NVIDIA build and would overwrite it).
    "jax",
    "apache-tvm>=0.25.0rc0",
    "mpi4py",
]
mpi = ["mpi4py", "pytest-mpi"]
tvm = ["apache-tvm>=0.25.0rc0", "apache-tvm-ffi>=0.1.12"]
triton = ["triton"]
gt4py = ["gt4py"]
# `hpcagent-bench export-hf`: parquet writer, load-back check, Hub push.
hf = ["pyarrow", "datasets>=2.17", "huggingface_hub"]
# experiments/judge_service.py (FastAPI router). starlette's TestClient needs httpx2 to avoid a
# deprecation warning.
judge-proxy = ["fastapi", "httpx", "httpx2==2.12.0"]
agent-anthropic = ["anthropic"]
agent-local = ["transformers", "huggingface-hub", "accelerate"]
agent-aider = ["aider-chat"]
agent-optimas = ["optimas-ai"]
harbor = ["harbor>=0.23"]  # the podman provider and flat numeric reward.json

# PEP 735 groups: never published with the distribution. `pip install --group linting` installs
# the formatters without the project.
[dependency-groups]
# pytest-forked: tests/ports/ runs each test in its own process (a bad ctypes index aborts the
# interpreter).
testing = ["pytest", "pytest-timeout", "pytest-xdist", "pytest-forked", "pytest-cov", "coverage"]
linting = ["ruff", "fprettify", "clang-format", "pre-commit"]
dev = [{ include-group = "testing" }, { include-group = "linting" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hpcagent_bench*"]

# Listed explicitly: the judge image builds the wheel from hpcagent_bench/ and pyproject.toml alone
# (no MANIFEST.in, no VCS file finder).
[tool.setuptools.package-data]
hpcagent_bench = [
    "config.yaml",
    "container_backends.txt",
    "envs/*.yaml",
    # -include'd on every gcc/g++ compile (CPU_BASELINE_GCC).
    "envs/vecmath.h",
    "envs/papi_ranges.h",
    # Kernel manifests, references in every language, and the numpy reference read as text. Kernel
    # dirs are not packages, so their .py files ship only through this list.
    "benchmarks/**/*.yaml",
    "benchmarks/**/*.c",
    "benchmarks/**/*.cpp",
    "benchmarks/**/*.cu",
    "benchmarks/**/*.f90",
    "benchmarks/**/*.hip",
    "benchmarks/**/*.hu",
    "benchmarks/**/*.j2",
    "benchmarks/**/*.md",
    "benchmarks/**/*.npz",
    "benchmarks/**/*.py",
    # Prompt templates, skill pages and tool fragments (harness/prompts.py).
    "harness/**/*.j2",
    "harness/**/*.md",
    "harness/kernelbench_map.tsv",
    "skills/*/SKILL.md",
    "skills/*/*.py",
    "tools/*.md",
]

# Third-party warnings only (zero-warning policy for our own code).
[tool.pytest.ini_options]
# The checkout under test, not whatever tree an editable install points at.
pythonpath = ["."]
filterwarnings = [
    # starlette's TestClient portal teardown, inside anyio/starlette.
    "ignore:.*BlockingPortal.*:DeprecationWarning:anyio",
    "ignore:.*BlockingPortal.*:DeprecationWarning:starlette",
]

# CI sets PYTEST_ADDOPTS per job. relative_files: jobs run in different filesystem layouts;
# parallel + concurrency: the suite runs under xdist and forks (tests/numerical_oracle.py).
[tool.coverage.run]
source = ["hpcagent_bench"]
branch = true
parallel = true
relative_files = true
concurrency = ["multiprocessing", "thread"]
omit = ["hpcagent_bench/benchmarks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# scripts/check_format.py routes every .py to ruff (pre-commit and CI call it).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*_generated.py"]

# Type-check against the requires-python floor.
[tool.pyright]
pythonVersion = "3.12"
