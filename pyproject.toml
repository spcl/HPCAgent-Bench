# The ONLY dependency list: package metadata, extras, the harness venvs' groups and the dace pin.
# The images install from this file without the package source (`uv pip install -r pyproject.toml
# --extra ...` installs the dependencies, never the project), so it holds nothing hidden.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcagent-bench"
version = "0.1.0"
description = "A benchmark for AI agents that optimize numerical code: NumPy kernels, a judge, and speedup scoring."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SPCL @ ETH Zurich", email = "yakupkoray.budanaz@inf.ethz.ch" }]
keywords = ["benchmark", "hpc", "llm-agents", "code-optimization", "numpy", "compilers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Benchmark",
]

# What the library imports at module level (hpcagent_bench/ outside benchmarks/ and tests/). The
# framework matrix (torch/jax/tvm/triton/...) is per platform and lives in the extras; numba is core
# because it is the default LLR/SciComp baseline.
# dace is not a dependency (PyPI rejects direct-URL requirements): scripts/install_dace.sh installs
# the commit [tool.hpcagent-bench] dace-pin names below.
dependencies = [
    "numpy>=2,<3",
    "scipy",
    "pandas",
    "matplotlib",
    "ml_dtypes",
    "pyyaml",
    "sqlmodel",
    "jinja2",
    "cffi",
    "sympy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/spcl/HPCAgent-Bench"
Repository = "https://github.com/spcl/HPCAgent-Bench"
Documentation = "https://github.com/spcl/HPCAgent-Bench/tree/main/docs"
Issues = "https://github.com/spcl/HPCAgent-Bench/issues"
Changelog = "https://github.com/spcl/HPCAgent-Bench/blob/main/CHANGELOG.md"

[project.scripts]
hpcagent-bench = "hpcagent_bench.cli:main"
hpcagent-bench-install-apptainer = "hpcagent_bench.containers:install_apptainer_main"
numpyto = "hpcagent_bench.translators.numpyto_common.cli:main"
numpyto_c = "hpcagent_bench.translators.numpyto_c.cli:main"
numpyto_fortran = "hpcagent_bench.translators.numpyto_fortran.cli:main"
numpyto_cupy = "hpcagent_bench.translators.numpyto_cupy.cli:main"
numpyto_numba = "hpcagent_bench.translators.numpyto_numba.cli:main"
numpyto_pythran = "hpcagent_bench.translators.numpyto_pythran.cli:main"

# Exactly one of cpu / amd / nvidia is a COMPLETE install for that hardware: the grading stack, every
# framework baseline, the judge, HF export, the agent clients and the developer tools ([dev]). Harbor
# itself is the adapter's dependency (adapters/hpcagent_bench/pyproject.toml): its rich>=14.1 cannot
# share an environment with the judge-proxy group below. The images install one of them (`uv pip install -r pyproject.toml --extra
# amd`); they differ only in the accelerator builds.
[project.optional-dependencies]
cpu = [
    "hpcagent_bench[dev]",
    "pygount",
    "jsonschema",
    "setuptools",
    "tree-sitter-language-pack",
    "psutil",
    "py-cpuinfo",
    "GPUtil",
    # dace@extended imports it at runtime.
    "ordered-set>=4.0.0",
    # 0.19.0 turns subset_sum into a >600 s hang, then a SIGSEGV. Bump in its own commit.
    "pythran==0.18.1",
    "xgboost",
    # Python bindings for the libhdf5 / libnetcdf the images install; the image smoke imports both.
    "h5py",
    "netCDF4",
    # dace's analyses fail closed without them (sequential loops, no diagnostic).
    "islpy",
    "z3-solver",
    # The upstream KernelBench models the machine_learning ports are compared against import it.
    "einops",
    # A CPU box installs torch from PyTorch's CPU index first (the PyPI wheel is the CUDA build); an
    # index cannot be named in a PEP 508 requirement. On the AMD image torch, jax's ROCm plugin and
    # triton come from the ROCm base image, not PyPI.
    "torch",
    "jax",
    "apache-tvm>=0.25.0rc0",
    "apache-tvm-ffi>=0.1.12",
    # Built from source against the system MPI (MPICC).
    "mpi4py",
    "gt4py",
    # `hpcagent-bench export-hf`: parquet writer, load-back check, Hub push.
    "pyarrow",
    "datasets>=2.17",
    "huggingface_hub",
    # The judge: experiments/judge_service.py's router (starlette's TestClient needs httpx2), the bound
    # judge tools' crawl/browser stack and openai-agents, without which the optimas harness cannot
    # start. The proxy the arms talk through is the judge-proxy group below.
    "fastapi",
    "httpx",
    "httpx2==2.12.0",
    "crawl4ai",
    "playwright",
    "uvicorn",
    "orjson",
    "tenacity",
    "rich",
    "typer",
    "openai-agents",
    # Agent clients: the Anthropic API and a locally hosted transformers model.
    "anthropic",
    "transformers",
    "accelerate",
]
amd = ["hpcagent_bench[cpu]"]
nvidia = ["hpcagent_bench[cpu]", "jax[cuda13]", "cupy-cuda13x", "triton"]
# Tests and formatters, also part of every hardware extra so the suite runs inside each image.
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    # tests/ports/ runs each test in its own process (a bad ctypes index aborts the interpreter).
    "pytest-forked",
    "pytest-cov",
    "pytest-mpi",
    "coverage",
    "ruff",
    "pyright",
    "fprettify",
    "clang-format",
    "pre-commit",
]

# PEP 735 groups: never published with the distribution, and installed without the project's own
# dependencies. Each is a stack that cannot share one resolution with the hardware extras.
[dependency-groups]
# The judge-agent images' LLM proxy the arms talk through, exactly as the recorded arms ran it; the
# images install it after their hardware extra. litellm 1.94 needs rich<14, so harbor>=0.23 never
# shares its environment.
judge-proxy = ["litellm[proxy]==1.94.0", "httpx2==2.12.0", "anyio==4.14.2"]
# The Python agent harnesses, each in its own image venv (/opt/harness/<name>) so its deps cannot
# displace the judge's pinned proxy stack. Groups, not extras: a group installs without the
# project's own dependencies.
harness-miniswe = ["mini-swe-agent==2.4.6"]
harness-openhands = ["openhands-sdk==1.47.0", "openhands-tools==1.47.0"]

# The spcl/dace@extended commit this release is tested with, and the ONE place it is written.
# scripts/install_dace.sh and the image builds install it; jobs refresh to the latest extended unless
# HPCAGENT_BENCH_DACE_REF=pinned (containers/images/dace_refresh.sh, docs/configuration.md#dace).
[tool.hpcagent-bench]
dace-pin = "221e8277ad16feff0699b9b79b02572e9d0ef7d7"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hpcagent_bench*"]

# Listed explicitly: the judge image builds the wheel from hpcagent_bench/ and pyproject.toml alone
# (no MANIFEST.in, no VCS file finder).
[tool.setuptools.package-data]
hpcagent_bench = [
    "config.yaml",
    "container_backends.txt",
    "envs/*.yaml",
    # -include'd on every gcc/g++ compile (CPU_BASELINE_GCC).
    "envs/vecmath.h",
    "envs/papi_ranges.h",
    # Kernel manifests, references in every language, and the numpy reference read as text. Kernel
    # dirs are not packages, so their .py files ship only through this list.
    "benchmarks/**/*.yaml",
    "benchmarks/**/*.c",
    "benchmarks/**/*.cpp",
    "benchmarks/**/*.cu",
    "benchmarks/**/*.f90",
    "benchmarks/**/*.hip",
    "benchmarks/**/*.hu",
    "benchmarks/**/*.j2",
    "benchmarks/**/*.md",
    "benchmarks/**/*.npz",
    "benchmarks/**/*.py",
    # Prompt templates, skill pages and tool fragments (harness/prompts.py).
    "harness/**/*.j2",
    "harness/**/*.md",
    "harness/kernelbench_map.tsv",
    "skills/*/SKILL.md",
    "skills/*/*.py",
    "tools/*.md",
    # Experiment tags: tags/<tag>.txt lists the kernels of experiment <tag> (hpcagent_bench.tags).
    "tags/*.txt",
]

# Third-party warnings only (zero-warning policy for our own code).
[tool.pytest.ini_options]
# The ONE place tests get their import path: the checkout under test (not whatever tree an editable
# install points at), plus the script directories whose modules run as scripts beside each other.
pythonpath = [".", "experiments", "experiments/mpi", "scripts", "containers/agent/tools", "containers/agent/harness"]
filterwarnings = [
    # starlette's TestClient portal teardown, inside anyio/starlette.
    "ignore:.*BlockingPortal.*:DeprecationWarning:anyio",
    "ignore:.*BlockingPortal.*:DeprecationWarning:starlette",
]

# CI sets PYTEST_ADDOPTS per job. relative_files: jobs run in different filesystem layouts;
# parallel + concurrency: the suite runs under xdist and forks (hpcagent_bench/numerical_oracle.py).
[tool.coverage.run]
source = ["hpcagent_bench"]
branch = true
parallel = true
relative_files = true
concurrency = ["multiprocessing", "thread"]
omit = ["hpcagent_bench/benchmarks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# scripts/checks/check_format.py routes every .py to ruff (pre-commit and CI call it).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*_generated.py"]

# Type-check against the requires-python floor.
[tool.pyright]
pythonVersion = "3.12"
