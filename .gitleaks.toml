# Secret scan: gitleaks' default rules (pre-commit hook `gitleaks`; full history: `gitleaks git --log-opts=--all`).
# The allowlist names each known false positive by its line, never a whole rule.
[extend]
useDefault = true

[allowlist]
description = "BibTeX entries and the repository's known non-secrets"
# BibTeX keys, DOIs and URLs read as generic API keys.
paths = ['''\.bib$''']
regexTarget = "match"
regexes = [
    # A pinned upstream commit, checked at build time.
    '''^PAPI_COMMIT=[0-9A-Fa-f]{40}$''',
    # Test fixtures: dummy endpoint keys, a leak-canary string and the pinned cache-key digest.
    '''^KEY = "(0123456789abcdef|fedcba9876543210)"$''',
    '''^SECRET = "sk-test-[0-9a-z-]+"$''',
    '''^PINNED_KEY = "[0-9a-f]{64}"$''',
]
