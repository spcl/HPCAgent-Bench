# Upstream projects, papers and textbooks named by the `# provenance:` line of each kernel manifest.
#
# A manifest's provenance line is a YAML flow mapping in a comment (the manifest schema has no
# provenance field yet):
#   # provenance: {kind: derived, upstream: pyfai, via: [npbench], detail: ...}
#   kind      derived    -- code lineage: ported, transcribed or adapted from upstream source
#             algorithm  -- written from a published algorithm, paper or specification; the
#                           upstream is cited, no upstream code is included
#             original   -- written for HPCAgent-Bench
#   upstream  one key of `upstreams` below, or a list of them (derived / algorithm only)
#   via       intermediaries the code passed through, in order (optional)
#   contributor  one key of `contributors` below (optional)
#   detail    upstream file, loop id or task the kernel comes from (optional)
#
# Entry fields: name, url, license (SPDX id, several joined by " AND "; LicenseRef-* for a
# project-specific license; NOASSERTION when upstream states none), copyright (the notice NOTICE
# reproduces for derived code), citation, note. `other` lists third-party files and data that are
# not kernels; its entries also name the files they cover. The license texts NOTICE reproduces are
# third_party/licenses/<license id>.txt.
#
# CONTRIBUTORS.md and NOTICE are rendered from this file and the manifests:
#   python scripts/render_attribution.py --write
