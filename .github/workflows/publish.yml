name: Publish

# A published GitHub release (helpers/release_patch.sh creates it on the tag) uploads that tag's wheel and sdist to
# PyPI through Trusted Publishing (OIDC: no token anywhere) and attaches the same files to the release, so the tag, the
# release and PyPI always hold one build. PyPI trusts this repository, this file and the `pypi` environment
# (pypi.org: project -> Settings -> Publishing).

on:
  release:
    types: [published]

# PACKAGES: the directories holding a pyproject.toml to publish.
env:
  PACKAGES: ". agent"

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
      # One build per release: the files helpers/release_patch.sh attached when it created the release, else a build of
      # the tag here, so PyPI and the release always hold the same bytes, whichever uploads first (skip-existing).
      - name: The release's files, else a build of the tag
        id: dists
        run: |
          tag="${{ github.event.release.tag_name }}"
          for package in ${PACKAGES}; do
            version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "${package}/pyproject.toml")"
            [[ "${tag}" == *"v${version}" ]] || { echo "${package}: tag ${tag} does not name version ${version}" >&2; exit 1; }
          done
          if [[ -n "$(gh release view "${tag}" --json assets -q '.assets[].name')" ]]; then
            gh release download "${tag}" -D dist -p '*.whl' -p '*.tar.gz'
            echo "built=false" >> "${GITHUB_OUTPUT}"
          else
            for package in ${PACKAGES}; do uv build "${package}" -o dist; done
            echo "built=true" >> "${GITHUB_OUTPUT}"
          fi
          uvx twine check --strict dist/*
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Attach the files to the release
        if: steps.dists.outputs.built == 'true'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
