name: Pages

# The project site on GitHub Pages: the leaderboard (web/, a Vite + React app that reads
# web/public/data/leaderboard.json; docs/leaderboard.md) at the root and the Sphinx documentation (docs/) under
# /docs/. Needs Settings > Pages > Source = GitHub Actions. The same Sphinx build runs with warnings as errors in
# CI's unit[0] job; this one only publishes.

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'web/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sphinx (the docs extra)
        run: python -m pip install sphinx myst-parser furo
      - name: Assemble the site
        run: |
          npm ci --prefix web
          npm run build --prefix web
          mkdir -p site
          cp -r web/dist/. site/
          sphinx-build -W --keep-going -b html docs site/docs
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
