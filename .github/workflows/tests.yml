      # spelling of this fix; actions/cache carries a deprecationMessage on it saying it "does not
      # work as intended", will be removed, and that a separate actions/cache/restore step is what
      # to use instead -- which is this.
      - name: Setup -- restore the compile cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.job }}-${{ env.CPU_KEY }}-${{ github.run_id }}
          restore-keys: ccache-${{ github.job }}-${{ env.CPU_KEY }}-
      # Zero AFTER the restore: the cache carries its own counters back, so zeroing earlier
      # would make the end-of-job stats cumulative instead of this run's hit rate.
      - name: Setup -- reset the ccache counters
        run: ccache --zero-stats
      - uses: ./.github/actions/setup

      - name: Phase 2a -- numpy-translator op suite
        # ~640 tests: per-op faithfulness plus feature-fix and corpus kernels, each emitted to
        # C/C++/Fortran (+ numba/pythran/jax where the test opts in), compiled, validated vs
        # numpy. A couple of full-kernel cases (cloudsc, velocity_tendencies) run ~5 min, and the
        # corpus-wide ABI agreement test walks every kernel in one test -- measured at 1294 s on a
        # loaded 16-core box after the shape-compare cache, hence --timeout=1500. xdist balances
        # the files across the runner's cores at runtime, which no static split can beat on a set
        # whose per-file cost spans three orders of magnitude.
        #
        # 60 -> 85 -> 110: run 33261681823 reached 85% in 60 minutes and died on the step timeout;
        # run 33283870554 then filled the 85-minute cap with every test green. Two single tests ate
        # 20 minutes each there (measured from the progress line timestamps), which is what
        # --timeout=1500 costs when a test wedges. No -q, so the failures arrive with names instead
        # of as bare F characters, and --durations names them.
        #
        # ``-m "not integration"`` for the same reason Phase 5c carries it: naming the directory by
        # PATH ignores markers, and the integration job ALREADY collects every
        # @pytest.mark.integration test under it (``-m integration tests/
        # hpcagent_bench/numpy_translators/tests/``). The two corpus-wide ABI sweeps are marked
        # integration and were the top TWO entries in this job's duration table at 1500 s each --
        # both of them the timeout cap, not real work -- so this job paid ~50 minutes for coverage
        # the integration job already provides.
        if: ${{ !cancelled() }}
        timeout-minutes: 38
        run: |
          python -m pytest -p no:cacheprovider -rfsxX -n auto --durations=25 --timeout=1500 \
            -m "not integration" hpcagent_bench/numpy_translators/tests/

      # Hit rate is the whole point of the cache -- surface it so a regression to 0% is visible.
      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # if: always() -- see the restore step. A red job still compiled, and its objects are what
      # makes the NEXT run warm; skipping the save on failure is what kept a cold cache cold. The
      # key carries github.run_id, so every run writes a fresh entry and never collides.
      - name: Save the compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.job }}-${{ env.CPU_KEY }}-${{ github.run_id }}
  # ===========================================================================================
  # frameworks-pluto -- the ONLY runner that builds Pluto. Codegen frameworks (cc/llvm/tvm/pluto)
  # + fp16, plus the pluto slice of the e2e sweep (pluto is opt-in in run_kernel, named here).
  # ===========================================================================================

      # if: always() -- a job that went red still covered lines on the way, and the total is more
      # honest with them than without. if-no-files-found: ignore for a job that failed before pytest.
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-translators
          path: .coverage*
          include-hidden-files: true
