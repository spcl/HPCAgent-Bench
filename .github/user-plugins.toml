# The first-class user plugins the user-plugins CI job installs and runs (tests/test_user_plugin_episodes.py): a
# released PyPI distribution (package, version) and the plugin folder inside its sdist. CI and a study's launch
# (`python helpers/scripts/user_plugins.py checkout DEST NAME`) unpack these releases;
# `python helpers/scripts/user_plugins.py bump` moves each to its distribution's newest PyPI release.
# A plugin with no PyPI release yet is pinned to a commit of its repository until its first release.

[plugins.tactics]
package = "dace-tactics"
version = "0.1.2"
folder = "plugin/tactics"

[plugins.alloy]
package = "dace-alloy"
version = "0.1.4"
folder = "alloy/hb_plugin"
