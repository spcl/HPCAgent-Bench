name: "HPCAgent-Bench CI setup"
description: >
  Native toolchain (make/gcc/g++/gfortran/clang/flang + OpenBLAS + FFTW + LAPACKE) and the base
  Python deps every CI runner shares. Job-specific extras (tvm, Pluto, gt4py, Apptainer) stay in
  the job so only the runner that needs one pays for it.

  Every Python install goes through pip against pyproject.toml, in ONE resolution per job rather
  than a base install followed by job-specific top-ups. The caller provisions the interpreter
  (actions/setup-python), as this action has always assumed.

inputs:
  extras:
    description: >
      Space-separated pyproject extras this job needs ON TOP of cpu + dace, e.g. "tvm gt4py".
      A job names what it grades and pays for nothing else. Passing them here rather than adding a
      second install step is not cosmetic: a later `install` cannot revise a version the first one
      already chose, so a job that tops up its own extras can end up with a resolution no single
      run of the resolver would have produced.
    required: false
    default: ""
  pip-args:
    description: >
      Extra raw flags for the install, e.g. "--no-binary mpi4py" where a job needs a package BUILT
      against a library it installed itself rather than taken as a wheel.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Native toolchain + OpenBLAS + FFTW
      shell: bash
      run: |
        # build-essential: make + gcc + g++ (C/C++ backends). gfortran: the GNU Fortran backend.
        # The LLVM half comes from apt.llvm.org in the next step, NOT from the distro -- see there.
        # pkg-config + libopenblas-dev: the BLAS optimizer links cblas_*. libfftw3-dev: the vexx
        # and cegterg port oracles link -lfftw3 and #include <fftw3.h>. Without it cegterg's
        # toolchain probe fails and 17 port-fidelity cases SKIP; verify_toolchain.py checks the
        # fftw3 pkg-config module so that provisioning gap is a red setup step, not a quiet skip.
        # liblapacke-dev: DaCe's LAPACK library nodes (cholesky2, contour_integral,
        # rayleigh_ritz_rotation) expand into generated C++ that #includes <lapacke.h>; the distro
        # package's own liblapack-dev alternative dep is already satisfied by libopenblas-dev above.
        # ninja + ccache are BUILD-SPEED dependencies, and both fail SILENTLY when absent rather
        # than erroring, so they belong here rather than in whichever job noticed first:
        #   ninja  -- DaCe picks its CMake generator with `shutil.which('ninja')` and only replays
        #             recorded compile commands when it picked Ninja (codegen/compiler.py). Without
        #             it, `compiler.command_cache` still reads True, CMake falls back to Make, and
        #             every SDFG pays a full configure. Nothing reports it; the build is just slow.
        #   ccache -- DaCe knows nothing about ccache. It helps only through a compiler launcher or
        #             a PATH shim, so the package has to exist before either can point at it.
        # libtbb-dev is the same shape of silent failure, and the reason it lives HERE rather than
        # in the jobs that noticed: libstdc++ picks its parallel <execution> backend per TU with
        # __has_include(<tbb/tbb.h>), so with the headers absent the par/par_unseq policies compile
        # and run SEQUENTIALLY under a parallel name -- a wrong measurement, not a build failure.
        # languages.stdpar_link_flags asks the compiler that same question before appending -ltbb,
        # so this package is what actually turns the cpp_isopar column parallel. It used to be
        # installed inline by seven jobs and missed by port-fidelity and gpu, which build C++ all
        # the same. The graded image installs it too (ce-images/amd/Dockerfile).
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran pkg-config libopenblas-dev libfftw3-dev \
          liblapacke-dev ninja-build ccache libtbb-dev

    - name: GNU Fortran matching the graded image
      shell: bash
      run: |
        # Same argument as the LLVM step below, for the OTHER family. The graded images
        # (containers/cpu.def, judge.def) are built `From: ubuntu:26.04`, whose gfortran implements
        # the F2018 DO CONCURRENT LOCALITY SPECS (`local()` / `shared()`); ubuntu-latest's
        # gfortran 13 does not, and hard-errors with "Syntax error in DO statement". A skill page
        # that teaches a construct the GRADED toolchain accepts then reads as a broken promise on
        # CI alone -- tests/test_parallelism_dispatch.py caught exactly that. Pin the major so the
        # runner answers for the same compiler the agent is graded on.
        #
        # The WHOLE GNU family moves together, gcc and g++ included. That used to be a
        # Fortran-only pin, but compilers.yaml now builds C at -std=c23, and the runner's default
        # gcc is 13: `gcc-13 -std=c23` is "unrecognized command line option ... did you mean
        # '-std=c2x'?" (measured), so every GNU C build would fail on CI. The major is the
        # one the GRADED image pins (containers/cluster/ce-images/amd/Dockerfile, GCC 16 +
        # LLVM 22), out of the same ubuntu-toolchain-r/test PPA, so CI answers for the
        # compiler the agent is actually graded on. /usr/local/bin precedes /usr/bin on the runner's
        # PATH, and compilers.yaml names the driver unversioned, so the symlink is what makes it
        # take effect.
        #
        # libstdc++-<major>-dev is NOT optional, and not for gfortran's sake. Installing gfortran-15
        # creates /usr/lib/gcc/<triple>/15, and clang selects the HIGHEST such directory whether or
        # not gcc-15 itself is installed -- so a Fortran-only pin silently re-toolchained clang onto
        # a GCC install carrying no C++ headers, and every clang C++ build died with
        # "fatal error: 'cstdint' file not found" (clang says so itself, as
        # -Wgcc-install-dir-libstdcxx: "'.../14' would be chosen over '.../15'"). That took out the
        # warnings ratchet, test_frameworks, test_default_datatype_tolerance and Pluto's configure
        # in one go. Complete the directory clang picks rather than pinning it to a path.
        set -euo pipefail
        GCC_MAJOR=16
        # add-apt-repository talks to Launchpad, which answered HTTP 500 twice in a row on
        # 2026-08-23 and took out five jobs across two runs before a single test had run
        # (lazr.restfulclient.errors.ServerError -> no python -> "No module named pytest").
        # Same retry shape as the llvm key fetch and pip_retry below: a transient upstream
        # outage should cost a minute, not a run.
        for attempt in 1 2 3 4 5; do
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
          if [ "$attempt" = 5 ]; then
            echo "::error::add-apt-repository failed 5 times; Launchpad is down, not this branch"
            exit 1
          fi
          echo "add-apt-repository attempt $attempt failed (Launchpad); retrying in $((attempt * 10))s" >&2
          sleep $((attempt * 10))
        done
        sudo apt-get update
        sudo apt-get install -y "gcc-${GCC_MAJOR}" "g++-${GCC_MAJOR}" "gfortran-${GCC_MAJOR}" \
          "libstdc++-${GCC_MAJOR}-dev"
        for driver in gcc g++ gfortran; do
          sudo ln -sf "/usr/bin/${driver}-${GCC_MAJOR}" "/usr/local/bin/${driver}"
        done
        # cc and c++ are part of that family and have no -<major> spelling to loop over, so they
        # need naming. Not cosmetic: dace resolves its host compiler as
        # `Config(compiler.cpu.executable) or $CXX or 'c++'` (dace/codegen/compiler_family.py), the
        # harness pins neither, and CMake's own default is `c++` as well -- so with only g++ linked,
        # every dace-compiled kernel built with the runner's /usr/bin/c++ while every other column
        # used the pinned major. That was GCC 13 against GCC 16, and 13 is the major dace itself
        # warns mislowers a masked select to silent zeros (_MISCOMPILING_GCC_MAJORS), so the dace
        # baseline the agent is graded against was the one build nobody had pinned.
        sudo ln -sf "/usr/bin/gcc-${GCC_MAJOR}" /usr/local/bin/cc
        sudo ln -sf "/usr/bin/g++-${GCC_MAJOR}" /usr/local/bin/c++
        gcc --version | head -1
        gfortran --version | head -1

    - name: LLVM toolchain (clang / clang++ / flang / libomp)
      shell: bash
      run: |
        # ubuntu-latest ships LLVM 18, whose Fortran driver is still spelled `flang-new`. The
        # harness is developed and measured against LLVM 22 -- envs/toolset.yaml names `clang-22`
        # first and languages.resolve_compiler takes the highest major on PATH, so that is what a
        # dev box resolves (flags.POLLY_PAR's Polly findings, the clang OpenMP-spelling
        # measurements behind flags.PLUTO_PAR). CI runs the same major: a CI-only LLVM is how a
        # count comes out 0 on a dev box and nonzero on a runner with nothing in the log to say
        # the toolchains differed.
        #
        # libomp-<major>-dev is the SECOND OpenMP runtime, required rather than optional:
        # tests/test_fork_openmp_safety.py asserts on it because libgomp deadlocks across fork()
        # and libomp recovers, so a suite that only ever sees libgomp cannot tell the fix from the
        # forgiving runtime. It puts the LINKER name under /usr/lib/llvm-<major>/lib while only the
        # runtime libomp.so.N lands on the default path -- hence `ld: cannot find -lomp` with the
        # package installed, which languages.LLVM_LIB_GLOBS is what resolves.
        #
        # The symlinks are NOT cosmetic. languages.resolve_compiler falls back to the highest
        # `<name>-<major>` on PATH, but flags.polly_capability probes bare `shutil.which("clang")`
        # and compilers.yaml names the drivers unversioned -- so without these, a distro clang left
        # on the box would keep winning and the LLVM columns would silently stay on 18.
        # /usr/local/bin precedes /usr/bin on the runner's PATH.
        set -euo pipefail
        LLVM_MAJOR=22
        for attempt in 1 2 3; do
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null && break
          echo "apt.llvm.org key fetch attempt $attempt failed; retrying in $((attempt * 5))s" >&2
          sleep $((attempt * 5))
        done
        codename=$(lsb_release -cs)
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_MAJOR} main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y "clang-${LLVM_MAJOR}" "flang-${LLVM_MAJOR}" "libomp-${LLVM_MAJOR}-dev"
        for driver in clang clang++ flang; do
          sudo ln -sf "/usr/bin/${driver}-${LLVM_MAJOR}" "/usr/local/bin/${driver}"
        done
        clang --version | head -1
        flang --version | head -1
        # A version banner does not prove clang can COMPILE. It resolves its libstdc++ from whichever
        # /usr/lib/gcc/<triple>/<major> directory sorts highest, so an unrelated step that installs a
        # versioned GCC component can leave the driver unable to find <cstdint> while --version still
        # answers happily. That shipped: five jobs went red before anything said the C++ arm was
        # broken. Compile the smallest TU that needs the standard library, here, loudly.
        printf '#include <cstdint>\nint main(){return 0;}\n' > "${RUNNER_TEMP}/cxx-smoke.cpp"
        clang++ -std=c++23 -fsyntax-only "${RUNNER_TEMP}/cxx-smoke.cpp" \
          || { echo "::error::clang++ cannot compile a <cstdint> TU -- its selected GCC install has no libstdc++ headers"; \
               clang++ -v -x c++ -E /dev/null 2>&1 | grep -i 'selected gcc installation' >&2; exit 1; }

    - name: Base Python deps (translators + the frameworks every phase shares)
      shell: bash
      run: |
        # ONE resolution for the whole job. Every framework this suite grades a kernel through --
        # numba/pythran/jax/torch/dace + the translator stack -- is an extra or a dependency group
        # in pyproject.toml, so a job asks for names in a single install and pip decides versions
        # once. A second install cannot revise what the first already chose, which is how a job ends
        # up with a set no single resolver run would produce.
        #
        # There is deliberately NO lockfile. A lock demands one resolution valid across every extra
        # at once, which this project cannot have: agent-aider hard-pins numpy==1.26.x against the
        # project's numpy>=2, and dace must track a branch tip rather than a commit. pyproject.toml
        # is the whole of the dependency metadata; pip resolves it per job.
        #
        # tvm/gt4py/triton/apptainer/Pluto stay job-specific and are added by the job that needs
        # one, so only that runner pays.
        set -euo pipefail
        # Retried: runners hit transient PyPI IncompleteRead/ProtocolError on wheels this size.
        pip_retry() { for i in 1 2 3 4 5; do python -m pip install "$@" && return 0; echo "pip attempt $i failed; retrying in $((i*5))s"; sleep $((i*5)); done; return 1; }

        # `--group` is pip 25.1 and newer; the runner image ships whatever it ships.
        python -m pip install --upgrade pip

        # torch BEFORE the project, and from PyTorch's CPU index. An index cannot be written into a
        # PEP 508 requirement, so this is the only place it can be said; the project install below
        # then finds `torch` already satisfied and leaves it alone. Without it the default PyPI
        # wheel is the CUDA build and drags ~2.5 GB of nvidia-* wheels onto a runner with no GPU.
        # requirements/torch-cpu.txt said the same thing by hand, on one job.
        pip_retry --index-url https://download.pytorch.org/whl/cpu torch

        # DaCe TRACKS THE extended BRANCH TIP. The `dace` extra is a direct git reference to the
        # branch, so every run of this step re-resolves it; nothing here freezes it and nothing
        # should. The suite grades kernels through dace and the emitters target what extended
        # supports TODAY (np.where and np.broadcast_to reach the Merge/Broadcast library nodes
        # there, so the emitter does not desugar them); a frozen dace made the emitter work around
        # gaps the branch had already closed.
        #
        # The cost is real: tests/test_dace_numeric_agreement.py ratchets NUMERIC_BAD in BOTH
        # directions, so a dace commit landing between two runs is attributed to whichever optarena
        # commit was in flight, and a "healed" kernel forces a deletion the next dace commit may
        # undo. A shared dace moving mid-run has faked ~40 failures here before. When a red is not
        # explained by the optarena diff, compare the sha echoed below across the two runs BEFORE
        # touching a ratchet list.
        #
        # There is NO override. A DACE_SHA escape hatch used to sit here "for a bisect", and it is
        # how run 32571640992 came to grade the corpus against a dace a week old and report four
        # symbol-propagation failures that the tip had already fixed -- a whole triage spent on
        # dead bugs. Bisect by installing a dace commit locally, not by teaching CI to freeze.
        extras="cpu,dace"
        for extra in ${{ inputs.extras }}; do
          extras="${extras},${extra}"
        done
        # shellcheck disable=SC2086 -- pip-args is a flag list, word splitting is the point
        pip_retry --group testing -e ".[${extras}]" ${{ inputs.pip-args }}

        # Echo the RESOLVED dace commit: a job that grades against dace must say which dace, or a
        # triage reader has to guess from the run date. A git install records it in direct_url.json.
        dace_rev=$(python - <<'PYEOF'
        import importlib.metadata, json
        info = json.loads(importlib.metadata.distribution("dace").read_text("direct_url.json"))
        print(info["vcs_info"]["commit_id"])
        PYEOF
        )
        echo "dace @ ${dace_rev}" >> "$GITHUB_STEP_SUMMARY"

        # DELIBERATELY no `DACE_compiler_build_mode=native` here. It used to be exported for speed
        # (native skips the per-SDFG cmake configure), and it silently DEFEATED the build cache the
        # framework pins: a DACE_* environment variable outranks Config.set, so
        # dace_framework.BUILD_CACHE_PINS asked for `cmake` on every job and got `native` -- which
        # writes per-object .o.cmd files, produces no compile_commands.json, and therefore makes
        # `compiler.command_cache` inert while still reporting True. The two optimizations are
        # mutually exclusive and only one of them is the framework's stated design, so the env var
        # goes and the pin decides. tests/test_dace_flavors.py fails if that inverts again.

    - name: Verify common toolchain (fail fast on a missing dependency)
      shell: bash
      run: |
        # Turn a silently-skipped test into a loud setup error so a provisioning regression
        # cannot masquerade as a green run. The script resolves compiler drivers the way the
        # HARNESS does, not with `command -v`: apt's `flang` is a metapackage whose only driver
        # is flang-new-18, and a bare lookup called that a miss while every test used it fine.
        python scripts/verify_toolchain.py
