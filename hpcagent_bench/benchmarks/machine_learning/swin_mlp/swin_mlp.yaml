  layers_2_blocks_1_mlp_fc1_bias: (16 * embed_dim,)
  layers_2_blocks_1_mlp_fc2_weight: {shape: "(4 * embed_dim, 16 * embed_dim)", weight_init: xavier}
  layers_2_blocks_1_mlp_fc2_bias: (4 * embed_dim,)
