# The POOLS: the neutral colour, the marker shapes and the lightness step every figure draws from.
#
# WHO TAKES WHICH SLOT is not here. An LLM, a standalone optimizer, a harness, a language, a device
# and a skill packet are classes registered by decorators (hpcagent_bench/models.py,
# hpcagent_bench/skill_packets.py, hpcagent_bench/vocabulary.py), and the explicit `order` of each is
# the slot it takes: hue `order` of the tab20 ramp, and marker `order` of the pools below. Import order
# never matters, an order is never renumbered (a new entry takes the next free one), and
# tests/test_vocabulary.py pins every slot, so a change that would repaint a published figure fails
# with the repaint it would cause. docs/extending/registry.md is the author's guide.
#
# Unknown values are not an error. A new experiment gets a plain label and a stable CRC colour, so
# adding one never breaks a plot; tests/test_display_names.py is what stops that fallback from going
# unnoticed, by reading the identity every setup env records and failing on a value no registered
# class names.


# ---------------------------------------------------------------------------------------------
# The pools. Every figure draws matplotlib's `tab20` (`hpcagent_bench.stats.palette` is the one place
# that looks a slot up); what is here is the neutral colour, the marker shapes and the lightness step.
# ---------------------------------------------------------------------------------------------

# The no-packet control. Neutral on purpose and not a tab20 slot: it is the reference every
# treatment is read against, not one more colour among them.
control_color: "#4d4d4d"

# A filled circle, square, triangle and diamond stay apart at 4pt where a pentagon and a hexagon do
# not, so identity survives a column-width figure and a greyscale print.
markers: ["o", "s", "^", "D", "v", "h", "P", "X", "*"]

# The SHAPE POOL of treatments. Its free shapes split in two: the first `harness_shapes` are the harnesses',
# the rest the packets', each kind taking its part in slot order unless a packet names its own `marker`, so
# registering either kind never reshapes another. The circle is the control's and never in the pool. A matplotlib marker:
# a one-character code, or [sides, style, angle] (style 0 polygon, 1 star, 2 asterisk). More
# treatments than shapes is a registry error, not a silent repeat.
harness_shapes: 8
shapes:
  - "s"
  - "^"
  - "D"
  - "v"
  - "P"
  - "X"
  - "*"
  - "p"
  - "h"
  - "<"
  - ">"
  - "d"
  - "8"
  - "H"
  - [4, 1, 0]
  - [6, 1, 0]
  - [5, 1, 180]
  - [7, 0, 0]
  - [5, 0, 180]
  - [8, 1, 0]
  - [4, 1, 45]
  - [3, 1, 0]
  - [6, 2, 0]
  - [5, 2, 0]
  - "+"
  - "x"
  - "1"
  - "2"
  - "3"
  - "4"
  - [7, 1, 0]
  - [9, 1, 0]
  - [7, 2, 0]
  - [8, 2, 0]
  - [9, 2, 0]
  - [10, 1, 0]
  - [10, 2, 0]
  - [8, 0, 22.5]
  - [3, 1, 180]
  - [6, 0, 30]
  - [4, 2, 45]

# How much lighter each packet BEYOND the lead makes the colour, so `cpf-src` and
# `cpf-src+lang-skills` read as one treatment family at two strengths. Large enough to read as a
# step, small enough that three steps stay clearly the lead's hue.
lightness_step: 0.13
