# Pre-commit formatting for HPCAgent-Bench (column limit 120).
#
#   one-time:   pip install pre-commit && pre-commit install
#   all files:  pre-commit run --all-files   (== python scripts/check_format.py --fix --all)
#   on commit:  runs automatically over staged files
#
# The single hook delegates to scripts/check_format.py --fix -- the SAME script
# the CI `format-check` job runs in check mode -- so local and CI share one
# routing table (yapf for .py, clang-format for C/C++, fprettify for Fortran, all
# at 120 cols) and one skip policy (hpcagent_bench/benchmarks/, hpcagent_bench/numpy_translators/,
# *_generated.*). check_format owns the skip logic, so any skipped file pre-commit
# happens to pass through is left untouched -- the hook is safe to run repo-wide.
repos:
  - repo: local
    hooks:
      - id: hpcagent_bench-format
        name: format (yapf / clang-format / fprettify @ 120 cols)
        entry: python scripts/check_format.py --fix
        language: system
        require_serial: true
        # Extensions check_format can route; the skip policy lives in that script.
        files: '\.([cC]|cc|cpp|cxx|hpp|hh|hxx|[hH]|py|[fF]|[fF]90|[fF]03|[fF]08|[fF]95|[fF]or)$'
      # Copyright / SPDX header on the CORE package (scope + skip policy live in the
      # script: hpcagent_bench/ minus benchmarks/ + numpy_translators/, plus scripts/ tests/).
      - id: hpcagent_bench-headers
        name: copyright / SPDX header (core package)
        # --fix ADDS the header (as the first content line, after any shebang) rather than only
        # failing -- the same auto-fix contract as the format hook. yapf leaves the header
        # byte-for-byte (locked by tests/test_header_hook.py), so the two fixers never fight.
        entry: python scripts/check_headers.py --fix
        language: system
        require_serial: true
        files: '\.py$'
      # Reject an oversized staged file: 500 KiB for a binary blob (datasets / dumps), 1 MiB for source.
      - id: hpcagent_bench-large-files
        name: block oversized files (500 KiB binary / 1 MiB text)
        entry: python scripts/check_large_files.py
        language: system
      # A kernel may not write through numpy's out= keyword: numba rejects it, pythran accepts
      # it and silently does nothing. Write the store as a store -- X[:] = np.f(a, b).
      - id: hpcagent_bench-no-out-kwarg
        name: no numpy out= in kernel sources
        entry: python scripts/check_no_out_kwarg.py
        language: system
        files: '^hpcagent_bench/benchmarks/.*\.py$'
      # Co-located kernel reference sources must be canonically named <stem>_reference.<ext>
      # (the prompt glob + test_<stem>_reference.py both key on it); ban _original/_orig/_golden/...
      - id: hpcagent_bench-reference-naming
        name: canonical <stem>_reference.<ext> reference sources
        entry: python scripts/check_reference_naming.py
        language: system
        files: '^hpcagent_bench/benchmarks/.*\.([cC]|cc|cpp|cxx|hpp|[hH]|py|[fF]|[fF]90|cu)$'
      # Repo-wide YAML house style (CONTRIBUTING.md "YAML house style"): '#' header, 2-space
      # structural indent, no tabs, no trailing whitespace, one final newline. --fix only
      # applies the lossless mechanical bits (whitespace/newline); an unfixable violation
      # (missing header, tabs, odd indent) still fails the commit for a human to fix. The
      # script owns its own skip policy (.github/, docker-compose -- foreign schemas).
      - id: hpcagent_bench-yaml-style
        name: YAML house style (header / 2-space indent / no tabs / final newline)
        entry: python tests/check_yaml_style.py --fix
        language: system
        require_serial: true
        files: '\.ya?ml$'
      # Every co-located kernel manifest must satisfy the schema hpcagent_bench.spec.BenchSpec
      # loads it against -- today that is only checked at BenchSpec.load() time (test / run
      # time). This hook calls BenchSpec.from_yaml itself (ONE source of truth: no schema is
      # re-declared here), so a broken manifest fails the commit instead.
      - id: hpcagent_bench-manifest-structure
        name: benchmark manifest structure (hpcagent_bench.spec.BenchSpec schema)
        entry: python scripts/check_manifest_structure.py
        language: system
        files: '^hpcagent_bench/benchmarks/.*\.yaml$'
