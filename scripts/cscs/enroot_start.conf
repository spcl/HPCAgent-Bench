# Entrypoint override for scripts/cscs/enroot_srun.sh, passed to `enroot start --conf`.
#
# Replaces the image's own entrypoint so the command enroot_srun.sh was given is what runs.
#
# It also RESTORES the task's environment. enroot strips SLURM_* inside the container -- even a
# variable passed explicitly with `--env SLURM_PROCID=7` arrives unset (measured 2026-09-17), most
# likely the site's 87-slurm.sh hook -- while an arbitrary `--env HB_PROBE=...` arrives intact. So
# enroot_srun.sh sends every forwarded variable under an HBFWD_ prefix that no hook recognises, and
# this function, which runs after the hooks, puts the real names back. Without it every rank reads
# SLURM_PROCID as unset, believes it is rank 0, runs every kernel, and writes the same CSV as its
# siblings.
#
# POSIX sh ONLY. enroot parses this file with sh, not bash: `local`, `compgen` and `${!name}` all
# fail here ("local: not in a function"). The eval below is fed variable NAMES only, each checked
# against [A-Za-z_][A-Za-z0-9_]*; values are read back through ordinary expansion, so no value is
# ever parsed as shell code, whatever it contains.
rc() {
    eval "$(env | sed -n 's/^HBFWD_\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' | while read -r n; do
        printf 'export %s="${HBFWD_%s}"; unset HBFWD_%s\n' "$n" "$n" "$n"
    done)"
    exec "$@"
}
